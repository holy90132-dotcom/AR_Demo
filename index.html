<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="theme-color"
    content="#15171c"
  >

  <title>For You</title>


  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR + A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        "Noto Sans TC",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #101217;

    }


    body::before {

      content: "";

      position: fixed;

      inset: 0;

      background:

        radial-gradient(
          circle at 30% 15%,
          rgba(235, 205, 179, 0.18),
          transparent 33%
        ),

        radial-gradient(
          circle at 75% 80%,
          rgba(140, 175, 213, 0.13),
          transparent 36%
        ),

        linear-gradient(
          160deg,
          #171a21 0%,
          #10131a 55%,
          #12171e 100%
        );

      z-index: -2;

    }


    body::after {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.22;

      background-image:

        radial-gradient(
          rgba(255,255,255,.5) 0.55px,
          transparent 0.55px
        );

      background-size:
        8px 8px;

      z-index: -1;

    }



    #ar {

      position: fixed;

      inset: 0;

    }



    /* =========================
       進場畫面
    ========================= */

    #overlay {

      position: fixed;

      inset: 0;

      z-index: 30;

      display: grid;

      place-items: center;

      padding: 24px;

      background:
        rgba(8, 10, 14, 0.26);

      backdrop-filter:
        blur(5px);

      transition:
        opacity .65s ease;

    }


    #overlay.fade-out {

      opacity: 0;

      pointer-events: none;

    }



    .memory-card {

      position: relative;

      width: min(
        88vw,
        410px
      );

      padding:
        38px
        27px
        28px;

      overflow: hidden;

      border-radius:
        30px;

      color:
        #f8f5ef;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.045)
        );

      border:
        1px solid
        rgba(255,255,255,.13);

      box-shadow:

        0 30px 90px
        rgba(0,0,0,.38),

        inset 0 1px 0
        rgba(255,255,255,.10);

      backdrop-filter:
        blur(22px);

    }



    .memory-card::before {

      content: "";

      position: absolute;

      width: 170px;
      height: 170px;

      right: -70px;
      top: -80px;

      border-radius: 50%;

      background:
        rgba(239, 207, 177, .12);

      filter:
        blur(1px);

    }



    .memory-card::after {

      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      left: -55px;
      bottom: -50px;

      border-radius: 50%;

      background:
        rgba(128, 177, 219, .09);

    }



    .small-title {

      position: relative;

      z-index: 2;

      margin-bottom:
        18px;

      color:
        rgba(255,255,255,.50);

      font-size:
        11px;

      font-weight:
        500;

      letter-spacing:
        .28em;

    }



    h1 {

      position: relative;

      z-index: 2;

      margin:
        0;

      max-width:
        310px;

      font-size:
        28px;

      line-height:
        1.55;

      font-weight:
        600;

      letter-spacing:
        .035em;

    }



    .line {

      position: relative;

      z-index: 2;

      width:
        38px;

      height:
        1px;

      margin:
        22px 0;

      background:
        rgba(255,255,255,.40);

    }



    .message {

      position: relative;

      z-index: 2;

      font-size:
        14px;

      line-height:
        2;

      letter-spacing:
        .025em;

      color:
        rgba(255,255,255,.74);

    }



    #startBtn {

      position: relative;

      z-index: 2;

      width:
        100%;

      margin-top:
        28px;

      padding:
        15px 18px;

      border:
        0;

      border-radius:
        999px;

      color:
        #282421;

      background:

        linear-gradient(
          180deg,
          #f7f2eb,
          #e9e1d7
        );

      box-shadow:

        0 10px 28px
        rgba(0,0,0,.20),

        inset 0 1px 0
        rgba(255,255,255,.9);

      font-size:
        15px;

      font-weight:
        650;

      letter-spacing:
        .05em;

      cursor:
        pointer;

      transition:
        transform .2s ease,
        opacity .2s ease;

    }


    #startBtn:active {

      transform:
        scale(.98);

    }


    #startBtn:disabled {

      opacity:
        .45;

    }



    .permission-note {

      position: relative;

      z-index: 2;

      margin-top:
        14px;

      text-align:
        center;

      color:
        rgba(255,255,255,.40);

      font-size:
        11px;

      line-height:
        1.6;

    }



    #status {

      position: relative;

      z-index: 2;

      margin-top:
        14px;

      min-height:
        20px;

      text-align:
        center;

      color:
        rgba(255,255,255,.52);

      font-size:
        12px;

      line-height:
        1.6;

      white-space:
        pre-wrap;

    }



    /* =========================
       AR 中的小提示
    ========================= */

    #hint {

      position:
        fixed;

      left:
        50%;

      top:
        20px;

      transform:
        translateX(-50%);

      z-index:
        20;

      display:
        none;

      padding:
        9px 15px;

      border-radius:
        999px;

      background:
        rgba(18, 20, 26, .48);

      border:
        1px solid
        rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.82);

      font-size:
        12px;

      letter-spacing:
        .04em;

      white-space:
        nowrap;

      backdrop-filter:
        blur(10px);

      transition:
        opacity .35s ease;

    }



    #toast {

      position:
        fixed;

      left:
        50%;

      bottom:
        30px;

      transform:
        translateX(-50%)
        translateY(15px);

      z-index:
        21;

      opacity:
        0;

      padding:
        11px 17px;

      border-radius:
        999px;

      background:
        rgba(248,245,239,.92);

      color:
        #292725;

      font-size:
        12px;

      font-weight:
        600;

      letter-spacing:
        .04em;

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.20);

      transition:
        .35s ease;

      pointer-events:
        none;

    }


    #toast.show {

      opacity:
        1;

      transform:
        translateX(-50%)
        translateY(0);

    }



    #soundUnlock {

      position:
        fixed;

      left:
        50%;

      bottom:
        30px;

      transform:
        translateX(-50%);

      z-index:
        25;

      display:
        none;

      border:
        1px solid
        rgba(255,255,255,.14);

      padding:
        12px 18px;

      border-radius:
        999px;

      background:
        rgba(20,24,31,.80);

      color:
        white;

      font-size:
        13px;

      backdrop-filter:
        blur(12px);

    }

  </style>

</head>


<body>


<div id="ar"></div>


<div id="overlay">

  <div class="memory-card">


    <div class="small-title">

      FOR YOU

    </div>


    <h1>
  時間像一場<br>
  <span class="nowrap">緩慢的洋流</span>
</h1>

<div class="line"></div>

<div class="message">

  一點一點沖淡記憶，<br>

  也帶走那些曾經很清楚的感受。<br><br>

  但有些回憶，<br>

  只是安靜地待著，<br>

  等你再次靠近。

</div>

<button id="startBtn">
  讓它醒來
</button>


    <div class="permission-note">

      需要使用相機才能開始

    </div>


    <div id="status"></div>


  </div>

</div>



<div id="hint">

  把鏡頭對準那張卡片

</div>


<div id="toast">

  找到了。

</div>


<button id="soundUnlock">

  開啟聲音

</button>



<script>


const TARGET_IMAGE =
  "./target.jpg";


const INTRO_VIDEO =
  "./intro.mp4";


const LOOP_VIDEO =
  "./loop.mp4";



const ar =
  document.getElementById(
    "ar"
  );


const overlay =
  document.getElementById(
    "overlay"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const hint =
  document.getElementById(
    "hint"
  );


const toast =
  document.getElementById(
    "toast"
  );


const soundUnlock =
  document.getElementById(
    "soundUnlock"
  );



let starting =
  false;



function setStatus(
  message
) {

  statusEl.textContent =
    message;

}



function showToast(
  message
) {

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },

    1600
  );

}



async function requestCamera() {

  if (
    !window.isSecureContext
  ) {

    throw new Error(
      "請用瀏覽器開啟這個網址。"
    );

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "目前無法使用相機。"
    );

  }



  const tries = [

    {

      video: {

        facingMode: {

          exact:
            "environment"

        }

      },

      audio:
        false

    },


    {

      video: {

        facingMode: {

          ideal:
            "environment"

        }

      },

      audio:
        false

    },


    {

      video:
        true,

      audio:
        false

    }

  ];



  let lastError =
    null;



  for (
    const constraints
    of tries
  ) {

    try {

      const stream =

        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );


      stream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );


      return;

    }

    catch (
      error
    ) {

      lastError =
        error;

    }

  }



  throw (
    lastError ||
    new Error(
      "無法開啟相機"
    )
  );

}




function loadImage(
  url
) {

  return new Promise(

    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(
            image
          );


      image.onerror =
        () =>
          reject(

            new Error(
              "卡片資料載入失敗"
            )

          );


      image.src =
        url;

    }

  );

}




async function compileTarget() {

  const CompilerClass =

    window.MINDAR
      ?.IMAGE
      ?.Compiler

    ||

    window.MINDAR
      ?.Compiler;



  if (
    !CompilerClass
  ) {

    throw new Error(
      "載入失敗，請重新整理。"
    );

  }



  setStatus(
    "正在準備…"
  );



  const image =
    await loadImage(
      TARGET_IMAGE
    );



  const compiler =
    new CompilerClass();



  await compiler
    .compileImageTargets(

      [image],

      progress => {

        const p =

          Math.max(

            0,

            Math.min(
              100,
              Number(progress) || 0
            )

          );


        setStatus(

          "正在準備… "

          +

          p.toFixed(0)

          +

          "%"

        );

      }

    );



  const buffer =
    await compiler
      .exportData();



  return URL
    .createObjectURL(

      new Blob(

        [buffer],

        {

          type:
            "application/octet-stream"

        }

      )

    );

}




function mountAR(
  mindUrl
) {


  ar.innerHTML = `


    <a-scene


      embedded


      mindar-image="
        imageTargetSrc: ${mindUrl};
        maxTrack: 1;
        filterMinCF: 0.001;
        filterBeta: 0.01;
        uiScanning: no;
        uiLoading: no;
        uiError: no;
      "


      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        alpha: true;
      "


      vr-mode-ui="
        enabled: false
      "


      device-orientation-permission-ui="
        enabled: false
      "


    >



      <a-assets>


        <video

          id="introVideo"

          src="${INTRO_VIDEO}"

          preload="auto"

          playsinline

          webkit-playsinline

          crossorigin="anonymous"

        ></video>



        <video

          id="loopVideo"

          src="${LOOP_VIDEO}"

          preload="auto"

          loop

          playsinline

          webkit-playsinline

          crossorigin="anonymous"

        ></video>


      </a-assets>




      <a-camera

        position="0 0 0"

        look-controls="
          enabled: false
        "

      ></a-camera>




      <a-entity

        id="target"

        mindar-image-target="
          targetIndex: 0
        "

      >



        <a-plane

          id="introPlane"

          position="
            0 0 0.02
          "

          width="
            1
          "

          height="
            0.5625
          "

          material="
            src: #introVideo;
            shader: flat;
          "

        ></a-plane>




        <a-plane

          id="loopPlane"

          position="
            0 0 0.021
          "

          width="
            1
          "

          height="
            0.5625
          "

          visible="
            false
          "

          material="
            src: #loopVideo;
            shader: flat;
          "

        ></a-plane>



      </a-entity>



    </a-scene>


  `;



  const target =
    document.getElementById(
      "target"
    );


  const introVideo =
    document.getElementById(
      "introVideo"
    );


  const loopVideo =
    document.getElementById(
      "loopVideo"
    );


  const introPlane =
    document.getElementById(
      "introPlane"
    );


  const loopPlane =
    document.getElementById(
      "loopPlane"
    );



  introVideo.muted =
    false;

  introVideo.volume =
    1;


  loopVideo.muted =
    false;

  loopVideo.volume =
    1;



  let introFinished =
    false;


  let targetVisible =
    false;



  async function playVideo(
    video
  ) {

    try {

      await video.play();

      soundUnlock.style.display =
        "none";

    }

    catch (
      error
    ) {

      console.log(
        "需要使用者再次點擊才能播放聲音"
      );


      soundUnlock.style.display =
        "block";


      soundUnlock.onclick =
        async () => {

          try {

            video.muted =
              false;

            video.volume =
              1;


            await video.play();


            soundUnlock.style.display =
              "none";

          }

          catch (
            e
          ) {

            console.error(
              e
            );

          }

        };

    }

  }




  target.addEventListener(

    "targetFound",

    async () => {


      targetVisible =
        true;


      hint.style.opacity =
        ".45";


      showToast(
        "找到了。"
      );



      if (
        introFinished
      ) {


        introPlane.setAttribute(
          "visible",
          false
        );


        loopPlane.setAttribute(
          "visible",
          true
        );


        await playVideo(
          loopVideo
        );

      }


      else {


        introPlane.setAttribute(
          "visible",
          true
        );


        loopPlane.setAttribute(
          "visible",
          false
        );


        await playVideo(
          introVideo
        );

      }


    }

  );




  target.addEventListener(

    "targetLost",

    () => {


      targetVisible =
        false;


      hint.style.opacity =
        "1";


      introVideo.pause();

      loopVideo.pause();


    }

  );




  introVideo.addEventListener(

    "ended",

    async () => {


      introFinished =
        true;


      introPlane.setAttribute(
        "visible",
        false
      );


      loopPlane.setAttribute(
        "visible",
        true
      );


      loopVideo.currentTime =
        0;


      if (
        targetVisible
      ) {

        await playVideo(
          loopVideo
        );

      }


    }

  );


}




startBtn.addEventListener(

  "click",

  async () => {


    if (
      starting
    ) {

      return;

    }


    starting =
      true;


    startBtn.disabled =
      true;



    try {


      setStatus(
        "正在打開…"
      );


      await requestCamera();



      const mindUrl =
        await compileTarget();



      setStatus(
        ""
      );


      overlay.classList.add(
        "fade-out"
      );


      setTimeout(

        () => {

          overlay.style.display =
            "none";

        },

        650

      );


      hint.style.display =
        "block";


      mountAR(
        mindUrl
      );


    }

    catch (
      error
    ) {


      console.error(
        error
      );


      let message =

        error?.message

        ||

        "目前無法開啟";



      if (
        error?.name ===
        "NotAllowedError"
      ) {

        message =
          "需要允許相機權限才能打開這段回憶";

      }


      setStatus(
        message
      );


      startBtn.disabled =
        false;


      starting =
        false;


    }


  }

);

</script>


</body>

</html>
